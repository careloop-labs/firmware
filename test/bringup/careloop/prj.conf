# CareLoop hardware bring-up suite.
# Console (SEGGER RTT) comes from the careloop board defconfig.

CONFIG_ZTEST=y
CONFIG_ZTEST_SHUFFLE=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Block rather than drop when the RTT buffer fills. Twister attaches
# scripts/rtt_console.py before flashing, so a reader is always draining;
# with the default NO_BLOCK_SKIP a slow reader silently loses test output,
# which surfaces as a flaky suite rather than an honest failure.
CONFIG_SEGGER_RTT_MODE_BLOCK_IF_FIFO_FULL=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384

CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_SENSOR=y

# test_i2c_bus_scan NAKs ~110 times per pass by design. CONFIG_I2C_LOG_LEVEL_OFF
# would be the obvious way to quieten that, but it fails to link: the nrfx TWIM
# shim still references its log const. WRN is the strongest level that both
# links and keeps per-NAK chatter out of the report.
CONFIG_I2C_LOG_LEVEL_WRN=y

CONFIG_TMP11X=y
CONFIG_BMI270=y

# Parity with the product prj.conf, which is why CONFIG_BMI270_TRIGGER is
# deliberately absent here too. The suite exists to verify the HAL that ships,
# so building it against a different trigger configuration is the single
# failure mode a bring-up suite must not have.
#
# The product turns the vendor driver's trigger support off because
# src/hal/motion_bmi270_ext.c owns both interrupt pins: any-motion and
# no-motion are distinguished only by INT_STATUS_0, which is read-to-clear,
# and the driver's bmi270_thread_cb() consumes it on every INT1 edge before
# checking whether a handler exists. Interrupts still work - the extension
# maps and services them - so careloop_hal_2_motion's data-ready test still
# has something to prove.
#
# INT1 is P1.15, INT2 is P0.09 - an NFC pin, freed by nfct-pins-as-gpios in
# careloop.dts, which reaches UICR only after a full erase and a power cycle.

CONFIG_MFD=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_REGULATOR_FIXED=y
CONFIG_NPM13XX_CHARGER=y

# LED_NPM13XX defaults on from the devicetree node.
CONFIG_LED=y

CONFIG_DEBUG_THREAD_INFO=y
