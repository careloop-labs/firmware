#
# Control build of the BLE bring-up on an nRF52840 DK.
#
# Zephyr applies this automatically for board target nrf52840dk/nrf52840 - it
# is merged on top of prj.conf purely because of its name and location. There
# is deliberately NO board definition for the DK in this repo: nrf52840dk
# already ships in Zephyr (boards/nordic/nrf52840dk), and a second definition
# under our BOARD_ROOT would be a duplicate of an existing board name rather
# than a new board.
#
# The DK exists here as the *known-good control*. careloop has an
# unresolved ~755 ppm HFXO/LFXO disagreement and an unpopulated antenna
# (U.FL only); running the identical image on a DK separates "this firmware is
# wrong" from "this board's RF is wrong". Keep the two builds differing in as
# few knobs as possible, or the comparison stops meaning anything.

# --- Console ------------------------------------------------------------
# prj.conf sets no console at all: on careloop it comes from
# careloop_defconfig, which selects RTT because the wearable has no UART
# pads. The DK's own defconfig instead selects UART console, so without this
# block the control build would print over UART while the board under test
# prints over RTT - and scripts/bringup.sh attaches rtt_console.py either way,
# so the DK would simply appear silent.
#
# Match the wearable's transport rather than the DK's convenience: same
# transport, same buffering behaviour, same truncation limits.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# --- Clocks -------------------------------------------------------------
# XTAL is already the Zephyr-wide default for the LF source, but state it:
# the whole point of this build is the clock question, so the control's clock
# configuration should be readable here and not inferred from a Kconfig
# default three trees away.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# Declare the same sleep-clock accuracy careloop_defconfig declares. This
# is what the banner's "declared SCA" field prints, and an unequal declaration
# would change the connection-timing margins the controller negotiates - one
# more difference to rule out before trusting a difference in behaviour.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y
