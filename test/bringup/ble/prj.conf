# CareLoop BLE bring-up. Console (SEGGER RTT) comes from the careloop_v2 board
# defconfig.
#
# Note what is deliberately NOT here: CONFIG_UART_CONSOLE / CONFIG_SERIAL. The
# root prj.conf sets both =y, which contradicts careloop_v2_defconfig (both =n,
# RTT console) on a board with no UART pads. Standalone apps under test/bringup
# do not inherit the root file - keep it that way.

CONFIG_LOG=y

# Synchronous logging: the init sequence is the diagnosis, so a hang partway
# through must not swallow the lines that led up to it.
CONFIG_LOG_MODE_IMMEDIATE=y

# Bigger than the other diagnostics: the BT stack is chatty at boot and the
# banner hexdumps the advertising payload.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

# --- Bluetooth ---------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Observer, purely as a receiver test. Advertising proves the transmitter and
# nothing else; if a central's CONNECT_IND never arrives, the question is
# whether this radio can hear anything at all. Scanning answers that without
# needing a specific peer - any BLE traffic in the room will do.
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="CareLoop wearable"
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y

# CONFIG_BT_EXT_ADV stays off. The extended-advertising branch in
# ble_advertising.c asks for Coded PHY, which iOS will not scan for - the same
# problem the root prj.conf already has a note about.
#
# CONFIG_BT_DIS / CONFIG_BT_BAS stay off too: device_info_service.c and
# battery_service.c hand-roll 0x180A and 0x180F, so enabling Zephyr's would
# register each service twice and nRF Connect would show duplicates.

# --- Bond persistence --------------------------------------------------------
# ble_manager.c calls settings_load(), so CONFIG_SETTINGS is needed to link at
# all. CONFIG_BT_SETTINGS without a storage backend is worse than useless - it
# links, runs, and silently stores nothing, which only shows up as a re-pairing
# prompt after a power cycle. storage_partition already exists in
# careloop_v2.dts at 0xF0000 (32 KB, 8 pages).
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Debuggable via ../debug.sh: -Og keeps locals live, and thread info lets the
# J-Link Zephyr plugin enumerate threads.
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
