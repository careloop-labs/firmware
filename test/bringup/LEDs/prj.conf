# LED exerciser. Console (SEGGER RTT) comes from the careloop_v2 board defconfig.

CONFIG_LOG=y

# Synchronous logging: output leaves the buffer as it is written, so the phase
# banner is on screen before the phase it announces starts, not after.
CONFIG_LOG_MODE_IMMEDIATE=y

# The RTT up-buffer defaults to 1024 B in NO_BLOCK_SKIP mode. This app prints
# little per cycle, but the solid phase ticks once a second for a while.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# The LEDs hang off the PMIC, not off MCU GPIO, so the whole nPM1300 stack has
# to come up before anything can be lit. REGULATOR_NPM13XX matters more than it
# looks: BUCK2 feeds +3V3, which is what the LED anodes sit on.
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_MFD=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y
CONFIG_REGULATOR_FIXED=y

# LED_NPM13XX defaults on from the devicetree node.
CONFIG_LED=y

# Debuggable via ../debug.sh: -Og keeps locals live, and thread info lets the
# J-Link Zephyr plugin enumerate threads.
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
