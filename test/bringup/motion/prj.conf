# Motion streamer. Console (SEGGER RTT) comes from the careloop board defconfig.

CONFIG_LOG=y

# Synchronous logging: a sample is on screen when it is taken, not batched
# behind the next one. This app is watched live while the board is moved.
CONFIG_LOG_MODE_IMMEDIATE=y

# Ten lines a second forever, and they are wide. The 1024 B default fills in a
# few seconds and NO_BLOCK_SKIP then drops silently, which reads as a sensor
# that stopped rather than a console that overflowed.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

# BMI270 defaults on from the devicetree node; SENSOR and I2C are what it needs.
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_SENSOR=y

# Parity with the product prj.conf: CONFIG_BMI270_TRIGGER is deliberately not
# set there, because src/hal/motion_bmi270_ext.c owns the interrupt pins
# instead. Setting it here would stream through a HAL configured differently
# from the one that ships.

# Debuggable via ../debug.sh: -Og keeps locals live, and thread info lets the
# J-Link Zephyr plugin enumerate threads.
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
