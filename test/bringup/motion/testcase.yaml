# Stays a standalone app rather than a ztest case: it streams until the board is
# reset, and a ztest run has to terminate. What it is for - checking axis
# orientation by tilting the board, and gyro scale by rotating it - is a
# judgement no assertion makes, and the suite's gyro checks are taken at rest so
# they cannot see scale at all. careloop_hal_2_motion covers the pass/fail part.

common:
  harness: console
  platform_allow:
    - careloop/nrf52840
  harness_config:
    type: multi_line
    ordered: true
    # Only that it initialised, armed the features, started hardware batching
    # and reached the stream. The samples themselves, and whether the events
    # ever fire, are for a person moving the board.
    #
    # The fifo line is worth matching rather than leaving to the eye: every
    # step in start_features() warns and carries on instead of aborting, so a
    # board where the FIFO never started still reaches "STREAMING" and looks
    # fine until someone reads the block above it.
    regex:
      - "CARELOOP MOTION STREAM"
      - "capabilities 0x[0-9a-f]+"
      - "fifo +[0-9]+ ms batches"
      - "STREAMING - reset the board to stop"
  tags:
    - bringup
    - hardware
    - level3

tests:
  bringup.motion:
    timeout: 60
