# Boot test. Console (SEGGER RTT) comes from the careloop_v2 board defconfig.

CONFIG_LOG=y

# Synchronous logging: output leaves the buffer as it is written, so a hang
# after main() cannot swallow the lines that led up to it.
CONFIG_LOG_MODE_IMMEDIATE=y

# Debuggable via ../debug.sh: -Og keeps locals live, and thread info lets the
# J-Link Zephyr plugin enumerate threads.
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
