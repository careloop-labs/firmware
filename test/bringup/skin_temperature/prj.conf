# Skin temperature streamer. Console (SEGGER RTT) comes from the careloop board
# defconfig.

CONFIG_LOG=y

# Synchronous logging: a sample is on screen when it is taken, not batched
# behind the next one. This app is watched live.
CONFIG_LOG_MODE_IMMEDIATE=y

# One line per second forever. The 1024 B default fills in well under a minute
# and NO_BLOCK_SKIP then drops silently, which looks like a stalled sensor.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# TMP11X defaults on from the devicetree node; SENSOR and I2C are what it needs.
CONFIG_I2C=y
CONFIG_SENSOR=y

# Debuggable via ../debug.sh: -Og keeps locals live, and thread info lets the
# J-Link Zephyr plugin enumerate threads.
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
