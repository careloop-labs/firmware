# Optical front end exerciser. Console (SEGGER RTT) comes from the careloop
# board defconfig.

CONFIG_LOG=y

# Synchronous logging: output leaves the buffer as it is written, so the phase
# banner is on screen before the phase it announces starts, not after.
CONFIG_LOG_MODE_IMMEDIATE=y

# The RTT up-buffer defaults to 1024 B in NO_BLOCK_SKIP mode. This app prints
# a countdown per phase over a run of about a minute.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# The AFE is on I2C; RESETZ is a GPIO; TX_SUP is a fixed regulator on a GPIO.
# REGULATOR_FIXED is what enables the +5V boost - without it the AFE still
# answers and every call still returns 0, but no emitter can draw current.
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# The detector phases overflow the 1024-byte default and hard-fault with an MPU
# stack-overflow in phase_baseline. Each phase function carries a ~196-byte
# frame of statistics, they nest three deep through collect() into the I2C
# read, and CONFIG_LOG_MODE_IMMEDIATE above formats every line on this same
# stack rather than a log thread's. Measured, not guessed: the emitter-only
# version of this app fitted in 1024 with almost nothing to spare, and one
# added log line was enough to fault it.
CONFIG_MAIN_STACK_SIZE=4096

# Debuggable via ../debug.sh: -Og keeps locals live, and thread info lets the
# J-Link Zephyr plugin enumerate threads.
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
