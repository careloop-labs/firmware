# I2C bus scan. Console (SEGGER RTT) comes from the careloop board defconfig.

CONFIG_LOG=y

# Synchronous logging: output leaves the buffer as it is written, so a hang
# on a wedged bus cannot swallow the lines that led up to it.
CONFIG_LOG_MODE_IMMEDIATE=y

# The RTT up-buffer defaults to 1024 B in NO_BLOCK_SKIP mode, which is not
# enough to hold a full scan report.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

CONFIG_I2C=y
CONFIG_GPIO=y

# A scan NAKs ~110 times per pass by design. CONFIG_I2C_LOG_LEVEL_OFF would
# be the obvious way to quieten that, but it fails to link: the nrfx TWIM
# shim still references its log const. WRN is the strongest level that both
# links and keeps per-NAK chatter out of the report.
CONFIG_I2C_LOG_LEVEL_WRN=y

CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
