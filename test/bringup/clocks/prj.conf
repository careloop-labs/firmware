# CareLoop clock A/B.
#
# Console: on careloop it comes from careloop_defconfig (RTT, no UART
# pads). On the DK it comes from boards/nrf52840dk_nrf52840.conf next to this
# file, which switches the DK off its default UART console onto RTT so
# scripts/bringup.sh works unchanged against either board.
#
# Deliberately NOT here: CONFIG_UART_CONSOLE / CONFIG_SERIAL. The root
# prj.conf sets both =y and contradicts careloop_defconfig; standalone apps
# under test/bringup do not inherit it - keep it that way.

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# The measurement busy-waits with the scheduler running and must not be
# preempted mid-gate by a log flush.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# No Bluetooth. This app must not share the radio's HFXO requests: the
# controller starts and stops HFXO around every radio event, which would
# corrupt both the startup timing and the ratio gate.

CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y
