#
# Control build of the clock A/B on an nRF52840 DK. Zephyr merges this on top
# of prj.conf automatically for board target nrf52840dk/nrf52840.
#
# There is deliberately no board definition for the DK in this repo: nrf52840dk
# ships with Zephyr, and a second definition under our BOARD_ROOT makes every
# build fail with "Board(s): {'nrf52840dk'}, defined multiple times".
# See boards/nrf52840DK/README.md.
#
# The DK's own defconfig selects a UART console; careloop's selects RTT.
# Match the wearable so scripts/bringup.sh - which always attaches
# rtt_console.py - works against either board, and so the two runs differ in
# as few knobs as possible. A/B comparisons are worth exactly as much as their
# controls.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
