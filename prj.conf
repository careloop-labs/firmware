# Minimal configuration for a placeholder app
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Console: deliberately not configured here.
#
# This file used to set CONFIG_CONSOLE/CONFIG_UART_CONSOLE/CONFIG_SERIAL=y,
# which overrode careloop_defconfig - the wearable exposes no UART pads, so its
# defconfig selects RTT and sets UART_CONSOLE=n/SERIAL=n. The product image
# therefore had no console at all on the real board, hidden only because
# build.sh defaults to the nRF52840 DK. Each board's defconfig picks its own
# console now: RTT on careloop, UART on the DK. Both already set
# CONFIG_CONSOLE=y themselves.

# Enable State Machine Framework (SMF)
CONFIG_SMF=y

# Enable BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_DEVICE_NAME="CareLoop wearable"
CONFIG_BT_DEVICE_APPEARANCE=833
# Note: Problem with ios for CONFIG_BT_EXT_ADV=y

# --- Console buffer ----------------------------------------------------------
# RTT is the only console this board has, and the default up-buffer is 1024 B -
# smaller than the Bluetooth stack's own boot output. In NO_BLOCK_SKIP mode the
# overflow is *dropped*, so the whole BLE init sequence, every error it would
# report included, silently never appears. Observed on hardware: the log ended
# mid-way through bt_hci_core's banner.
#
# The mode stays NO_BLOCK_SKIP: BLOCK_IF_FIFO_FULL would hang an untethered
# wearable the moment its buffer filled with nobody attached. Only the size
# changes.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# --- Bond persistence --------------------------------------------------------
# CONFIG_BT_SETTINGS without a storage backend is worse than useless: it links,
# runs, and silently stores nothing, so the only symptom is a phone re-prompting
# to pair after every power cycle. No devicetree change is needed - settings_nvs
# falls back to storage_partition when nothing is chosen as
# zephyr,settings-partition, and careloop.dts already defines it at 0xF0000
# (32 KB, 8 pages).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# --- PMIC ---------------------------------------------------------------------
# The battery service reads VBAT from the nPM1300's own ADC. There is no
# resistor divider into a SAADC pin on this board, so this is the only
# measurement available.
CONFIG_SENSOR=y
CONFIG_MFD=y
CONFIG_MFD_NPM13XX=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM13XX=y


# --- IMU ----------------------------------------------------------------------
# Also gates the any-motion attributes: SLOPE_TH and SLOPE_DUR sit inside
# #if defined(CONFIG_BMI270_TRIGGER), so without this wake-on-motion cannot be
# configured at all, not just not fired.
#
# GLOBAL_THREAD over OWN_THREAD: the handler only notes an event, so a
# dedicated 1 KB stack buys nothing. Needs CONFIG_GPIO, already in
# careloop_defconfig. Like the PMIC symbols above, ignored on the DK, which
# has no bmi270 node.
CONFIG_BMI270_TRIGGER_GLOBAL_THREAD=y
