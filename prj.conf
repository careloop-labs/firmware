# Absolutely minimal CareLoop Configuration for NCS

# Only enable what's absolutely necessary
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_THREAD_STACK_INFO=y

# Sensor subsystem
CONFIG_SENSOR=y
CONFIG_I2C=y

# MAX30102 Heart Rate Sensor
CONFIG_MAX30102=y

# MPU6050 Motion Sensor (Zephyr built-in driver)
CONFIG_MPU6050=y

# HAL Test Application (uncomment to test HAL)
# CONFIG_HAL_TEST=y

# Enable float formatting in logging (cbprintf) so %f works in LOG_*
CONFIG_CBPRINTF_FP_SUPPORT=y